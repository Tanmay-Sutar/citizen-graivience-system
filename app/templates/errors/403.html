{% extends 'base.html' %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 text-center py-5">
        <h1 class="display-1 fw-bold text-warning">403</h1>
        <h3 class="mb-3">Access Forbidden</h3>
        <p class="text-muted mb-4">You don't have permission to access this page. Please log in with the appropriate role.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-5">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </a>
    </div>
</div>
{% endblock %}
